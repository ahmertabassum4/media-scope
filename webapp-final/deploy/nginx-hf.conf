# nginx for the merged HF Space: serves the static frontend and proxies /api/ to the
# backend running on 127.0.0.1:8000 in the same container. Listens on 7860 (the port
# declared via `app_port` in README.md).
server {
    listen 7860;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # URL analysis (screenshot + LLM calls) can take a while.
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }

    location / {
        try_files $uri /index.html;
    }
}

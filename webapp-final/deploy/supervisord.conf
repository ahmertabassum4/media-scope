; Runs the three services inside the single HF Space container.
; Child processes inherit the container environment (OPENROUTER_API_KEY, HF_TOKEN,
; GAME_DATASET_REPO, ... set as Space secrets/variables), so we only add per-process
; overrides here.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:models]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/app/models_service
autorestart=true
startsecs=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app/backend
environment=MODELS_API_URL="http://127.0.0.1:8001",DATA_DIR="/app/backend/data",GAME_RESPONSES_PATH="/tmp/game_responses.csv"
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
